name: tanstack-start
services:
  delay-proxy:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./delay-proxy.js:/app/delay-proxy.js:ro
    command: node delay-proxy.js
    environment:
      - DELAY_MS=2000
      - TARGET=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cdn-edge:
    image: nginx:1.31-alpine
    ports:
      - "8081:80"
    volumes:
      - ./.output/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
